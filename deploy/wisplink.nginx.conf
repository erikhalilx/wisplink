# Include this file from the http block. Replace example hosts and TLS paths.
limit_req_zone $binary_remote_addr zone=wisplink_preview:2m rate=4r/s;
limit_req_zone $binary_remote_addr zone=wisplink_console:2m rate=8r/s;
limit_req_zone $binary_remote_addr zone=wisplink_auth:2m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=wisplink_per_ip:2m;
limit_conn_zone $server_name zone=wisplink_total:1m;

server {
    listen 80;
    server_name console.example.com;
    return 308 https://console.example.com$request_uri;
}

server {
    listen 80;
    server_name preview.example.com;
    access_log off;
    error_log /dev/null crit;
    return 308 https://preview.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name console.example.com;
    ssl_certificate /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    root /var/www/wisplink;
    client_max_body_size 52m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin always;

    proxy_set_header Host $server_name;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/v1/session {
        limit_req zone=wisplink_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/v1/ {
        limit_req zone=wisplink_console burst=12 nodelay;
        limit_conn wisplink_per_ip 4;
        limit_conn wisplink_total 18;
        proxy_pass http://127.0.0.1:8000;
    }

    location /oauth/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 8k;
        limit_req zone=wisplink_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name preview.example.com;
    ssl_certificate /etc/letsencrypt/live/preview.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.example.com/privkey.pem;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8k;
    limit_req_status 429;
    limit_conn_status 429;

    location /p/ {
        limit_req zone=wisplink_preview burst=8 nodelay;
        limit_conn wisplink_per_ip 3;
        limit_conn wisplink_total 10;
        limit_rate 256k;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8000;
    }

    location / { return 404; }
}
