[project]
name = "wisplink"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "authlib>=1.6,<2",
  "cryptography>=45",
  "fastapi>=0.116,<1",
  "flask>=3.1,<4",
  "gunicorn>=23,<26",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wisplink = "wisplink.cli:app"
